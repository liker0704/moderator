version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: moderator_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moderator_db}
      POSTGRES_USER: ${DB_USER:-moderator}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moderator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moderator_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: moderator_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-moderator_db}
      DB_USER: ${DB_USER:-moderator}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MODERATOR_TG_USER_ID: ${MODERATOR_TG_USER_ID}

      # Discord (loaded from DB)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # LLM (v0.2+)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo}

      # Other
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID}
    volumes:
      - ./backend/src:/app/src  # For development (remove in production)
    ports:
      - "127.0.0.1:8000:8000"  # API port (optional)

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: moderator_worker
    restart: unless-stopped
    command: python -m arq src.job_queue.worker.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-moderator_db}
      DB_USER: ${DB_USER:-moderator}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MODERATOR_TG_USER_ID: ${MODERATOR_TG_USER_ID}

      # Discord (loaded from DB)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # LLM (v0.2+)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo}

      # Other
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID}
    volumes:
      - ./backend/src:/app/src  # For development (remove in production)

volumes:
  postgres_data:
  redis_data:
